<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#121613"><meta name="description" content="大きなボタンで操作できる筋トレ用セット・インターバルタイマーとタバタタイマー。"><title>SETFLOW — トレーニングタイマー</title><link rel="stylesheet" href="style.css"><script type="module" src="app.js"></script></head>
<body><main><header><a class="brand" href="./" aria-label="SETFLOW ホーム"><span class="mark">Ⅱ</span> SETFLOW</a><span class="header-note">ひとつずつ、積み重ねる。</span></header>
<nav aria-label="トレーニングモード"><button id="strength-tab" class="tab active" aria-pressed="true">セット & 休憩</button><button id="tabata-tab" class="tab" aria-pressed="false">タバタ</button></nav>
<section class="workspace"><div class="timer-panel"><div class="panel-top"><span id="mode-label">STRENGTH</span><span id="session-label">自分のペースで</span></div><div class="status" id="status" role="status" aria-live="polite">トレーニング</div><div id="exercise-title">1セット目</div><div class="dial" id="dial"><div class="dial-inner"><div id="digits">01</div><div id="unit">SET</div></div></div><p id="next-label">セットが終わったら、休憩をスタート</p><button id="primary" class="primary">休憩をスタート <span>↗</span></button><div class="secondary-row"><button id="reset">次の種目へ · セットをリセット</button><button id="stop" hidden>終了する</button></div><p class="timer-note">タイマー中は、この画面を開いてお使いください。</p></div>
<aside><section id="strength-settings" class="settings"><div class="section-heading"><h1>休憩の設定</h1><span>INTERVAL</span></div><label for="rest-seconds">インターバル</label><div class="number-field"><input id="rest-seconds" type="number" min="1" max="3600" value="60" inputmode="numeric"><span>秒</span></div><div class="presets"><button data-rest="30">30秒</button><button data-rest="60" class="selected">60秒</button><button data-rest="90">90秒</button><button data-rest="120">120秒</button></div><p class="description">休憩が終わると、セット数がひとつ進みます。種目を変えるときはリセットしてください。</p></section>
<section id="tabata-settings" class="settings" hidden><div class="section-heading"><h1>トレーニングの構成</h1><span>TABATA</span></div><div class="metrics"><div><b>20<span>秒</span></b><small>負荷</small></div><div><b>10<span>秒</span></b><small>休憩</small></div><div><b id="total-time">4:00</b><small>合計</small></div></div><div class="round-field"><label for="rounds">繰り返すセット数</label><input id="rounds" type="number" min="1" max="20" value="2" inputmode="numeric"></div><div class="list-heading"><h2>種目と順番</h2><span id="exercise-count">4種目 / セット</span></div><div id="exercise-list"></div><button id="add-exercise" class="add">＋ 種目を追加</button><p class="description">上から順に、負荷20秒 → 休憩10秒。最後の休憩まで自動で進みます。</p></section>
<section class="sound-setting"><label><input id="sound" type="checkbox" checked> 終了・切り替え音</label><span>♪</span></section><p id="error" role="alert"></p></aside></section><footer><span>SETFLOW / TRAINING TIMER</span><span>今日の、自分のペースで。</span></footer></main></body></html>
